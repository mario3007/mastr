version: '3.8'

services:
  # Python Audio Mastering Worker (FastAPI + DSP Engine)
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: mastr-audio-worker
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MASTR_STORAGE_DIR=/var/mastr/storage
      - SERVICE_BASE_URL=http://localhost:8000
    volumes:
      - mastr_audio_storage:/var/mastr/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Next.js Web Frontend & API Gateway
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mastr-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - WORKER_SERVICE_URL=http://worker:8000
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mastr_audio_storage:
    driver: local
